<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b161d"/>
      <stop offset="100%" stop-color="#111b2c"/>
    </linearGradient>
    <radialGradient id="glowTeal" cx="10%" cy="12%" r="60%">
      <stop offset="0%" stop-color="#64e5d7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#64e5d7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="92%" cy="88%" r="60%">
      <stop offset="0%" stop-color="#9cacec" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#9cacec" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="iconGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#64e5d7"/>
      <stop offset="100%" stop-color="#9cacec"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#64e5d7"/>
      <stop offset="55%" stop-color="#9cacec"/>
      <stop offset="100%" stop-color="#c9a4f0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  <rect width="1200" height="675" fill="url(#glowTeal)"/>
  <rect width="1200" height="675" fill="url(#glowPurple)"/>

  <!-- Mark: magnifying glass + checkmark, same brand mark as the product's own icon/banner -->
  <g transform="translate(514,150) scale(2.4)" stroke="url(#iconGrad)" fill="none"
     stroke-linecap="round" stroke-linejoin="round">
    <circle cx="32" cy="32" r="22" stroke-width="5.5"/>
    <line x1="48.5" y1="48.5" x2="68" y2="68" stroke-width="6"/>
    <path d="M22 33 L29 40 L43 24" stroke-width="4.5"/>
  </g>

  <!-- Headline -->
  <text x="600" y="345" font-family="Arial, Helvetica, sans-serif" font-size="84" font-weight="800" letter-spacing="-1.5" text-anchor="middle" fill="url(#textGrad)">Askentra</text>

  <!-- Badge -->
  <rect x="380" y="410" width="440" height="46" rx="23" fill="#ffffff" fill-opacity="0.06" stroke="#64e5d7" stroke-opacity="0.55" stroke-width="1.5"/>
  <text x="600" y="439" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="1.6" fill="#8fe9de" text-anchor="middle">GROUNDED, CITED AI ANSWERS</text>

  <!-- Tagline -->
  <text x="600" y="510" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#aab4cf" opacity="0.9" text-anchor="middle">Natural language search over your documents</text>
</svg>
