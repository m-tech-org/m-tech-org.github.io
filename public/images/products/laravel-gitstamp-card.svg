<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#140a29"/>
      <stop offset="100%" stop-color="#20123f"/>
    </linearGradient>
    <radialGradient id="glowPurple" cx="12%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="92%" cy="88%" r="60%">
      <stop offset="0%" stop-color="#01a2c7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#01a2c7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="iconGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8e4ec6"/>
      <stop offset="100%" stop-color="#01a2c7"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d59cff"/>
      <stop offset="50%" stop-color="#8e4ec6"/>
      <stop offset="100%" stop-color="#4ccce5"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  <rect width="1200" height="675" fill="url(#glowPurple)"/>
  <rect width="1200" height="675" fill="url(#glowCyan)"/>

  <!-- Icon badge -->
  <rect x="550" y="112" width="100" height="100" rx="24" fill="url(#iconGrad)"/>
  <g transform="translate(568,130) scale(2.7)" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="6" cy="6" r="2.2"/>
    <circle cx="6" cy="18" r="2.2"/>
    <circle cx="18" cy="12" r="2.2"/>
    <path d="M6 8.2V15.8"/>
    <path d="M8 6.6 15.8 11"/>
  </g>

  <!-- Headline -->
  <text x="600" y="300" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="800" letter-spacing="-1.5" fill="#f8fafc" text-anchor="middle">Laravel</text>
  <text x="600" y="378" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="800" letter-spacing="-1.5" text-anchor="middle">
    <tspan fill="url(#textGrad)">GitStamp</tspan>
  </text>

  <!-- FREE badge -->
  <rect x="460" y="410" width="280" height="46" rx="23" fill="#ffffff" fill-opacity="0.06" stroke="#01a2c7" stroke-opacity="0.65" stroke-width="1.5"/>
  <text x="600" y="439" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#4ccce5" text-anchor="middle">FREE &amp; OPEN SOURCE</text>

  <!-- Tagline -->
  <text x="600" y="510" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#c4b5fd" opacity="0.9" text-anchor="middle">Deploy-time git commit stamping for Laravel apps</text>
</svg>
