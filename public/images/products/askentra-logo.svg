<!--
App icon source. Same mark as banner/banner.png and the header logo in
frontend/src/components/ChatInterface.jsx (magnifying glass + checkmark,
viewBox 0 0 76 76) — this file just re-centers that mark on a square dark
canvas so it works as a standalone icon instead of a wide banner.

Regenerate icon.png/icon.ico/icon.icns from this with:
    python3 packaging/render-icons.py
-->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
    <defs>
        <linearGradient id="mark" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#64E5D7"/>
            <stop offset="100%" stop-color="#9CACEC"/>
        </linearGradient>
    </defs>
    <rect width="256" height="256" rx="56" fill="#0B161D"/>
    <g transform="translate(44.4,44.4) scale(2.2)" stroke="url(#mark)" fill="none"
       stroke-linecap="round" stroke-linejoin="round">
        <circle cx="32" cy="32" r="22" stroke-width="5.5"/>
        <line x1="48.5" y1="48.5" x2="68" y2="68" stroke-width="6"/>
        <path d="M22 33 L29 40 L43 24" stroke-width="4.5"/>
    </g>
</svg>
