<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#140a29"/>
      <stop offset="100%" stop-color="#20123f"/>
    </linearGradient>
    <radialGradient id="glowPurple" cx="12%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowNeutral" cx="92%" cy="88%" r="60%">
      <stop offset="0%" stop-color="#94a3b8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="iconGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="55%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="55%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  <rect width="1200" height="675" fill="url(#glowPurple)"/>
  <rect width="1200" height="675" fill="url(#glowNeutral)"/>

  <!-- Icon badge -->
  <rect x="550" y="112" width="100" height="100" rx="24" fill="url(#iconGrad)"/>
  <g transform="translate(570,132) scale(2.5)" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="10" width="16" height="11" rx="2"/>
    <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
    <circle cx="12" cy="15.5" r="1.4" fill="#ffffff" stroke="none"/>
  </g>

  <!-- Headline -->
  <text x="600" y="300" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="800" letter-spacing="-1.5" fill="#f8fafc" text-anchor="middle">VaultA</text>
  <text x="600" y="378" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="800" letter-spacing="-1.5" text-anchor="middle">
    <tspan fill="url(#textGrad)">GramBot</tspan>
  </text>

  <!-- UPCOMING badge -->
  <rect x="440" y="410" width="320" height="46" rx="23" fill="#ffffff" fill-opacity="0.06" stroke="#94a3b8" stroke-opacity="0.65" stroke-width="1.5"/>
  <text x="600" y="439" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#cbd5e1" text-anchor="middle">UPCOMING · FREEMIUM</text>

  <!-- Tagline -->
  <text x="600" y="510" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#c4b5fd" opacity="0.85" text-anchor="middle">Telegram vault bot — in development</text>
</svg>
