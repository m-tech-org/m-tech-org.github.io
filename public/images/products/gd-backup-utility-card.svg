<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#140a29"/>
      <stop offset="100%" stop-color="#20123f"/>
    </linearGradient>
    <radialGradient id="glowPurple" cx="12%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowAmber" cx="92%" cy="88%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="iconGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="55%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="55%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background: safe to crop, purely decorative -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  <rect width="1200" height="675" fill="url(#glowPurple)"/>
  <rect width="1200" height="675" fill="url(#glowAmber)"/>

  <!--
    Everything below is centered on (600, 337.5) and kept inside a
    900x480 safe zone so it survives a center object-fit: cover crop
    at any card aspect ratio from ~1.35:1 (narrow) to ~2.5:1 (wide).
  -->

  <!-- Icon badge -->
  <rect x="550" y="112" width="100" height="100" rx="24" fill="url(#iconGrad)"/>
  <g transform="translate(568,130) scale(2.7)" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 14.9A7 7 0 1 1 15.7 8h1.8a4.5 4.5 0 0 1 2.5 8.24"/>
    <path d="M12 12v9"/>
    <path d="m16 16-4-4-4 4"/>
  </g>

  <!-- Headline -->
  <text x="600" y="300" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="800" letter-spacing="-1.5" fill="#f8fafc" text-anchor="middle">Google Drive</text>
  <text x="600" y="378" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="800" letter-spacing="-1.5" text-anchor="middle">
    <tspan fill="#f8fafc">Backup </tspan>
    <tspan fill="url(#textGrad)">Utility</tspan>
  </text>

  <!-- PRO badge -->
  <rect x="500" y="410" width="200" height="46" rx="23" fill="#ffffff" fill-opacity="0.06" stroke="#f59e0b" stroke-opacity="0.65" stroke-width="1.5"/>
  <text x="600" y="439" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#fbbf24" text-anchor="middle">PRO EDITION</text>

  <!-- Tagline -->
  <text x="600" y="510" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#c4b5fd" opacity="0.9" text-anchor="middle">Automated backups to your own Google Drive</text>
</svg>
