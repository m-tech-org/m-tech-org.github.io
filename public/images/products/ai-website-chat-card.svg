    </radialGradient>
    <linearGradient id="iconGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8e4ec6"/>
      <stop offset="100%" stop-color="#01a2c7"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d59cff"/>
      <stop offset="50%" stop-color="#8e4ec6"/>
      <stop offset="100%" stop-color="#4ccce5"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  <rect width="1200" height="675" fill="url(#glowPurple)"/>
  <rect width="1200" height="675" fill="url(#glowCyan)"/>

  <!-- Icon badge -->
  <rect x="550" y="112" width="100" height="100" rx="24" fill="url(#iconGrad)"/>
  <g transform="translate(566,128) scale(2.9)" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 4h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H8l-4 4V6a2 2 0 0 1 2-2Z"/>
    <path d="M8.5 10.5c.9-1 2.2-1.5 3.5-1.5s2.6.5 3.5 1.5" opacity="0"/>
    <circle cx="9" cy="10.5" r="0.6" fill="#ffffff" stroke="none"/>
    <circle cx="12" cy="10.5" r="0.6" fill="#ffffff" stroke="none"/>
    <circle cx="15" cy="10.5" r="0.6" fill="#ffffff" stroke="none"/>
  </g>

  <!-- Headline -->
  <text x="600" y="300" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="800" letter-spacing="-1.5" fill="#f8fafc" text-anchor="middle">AI Website</text>
  <text x="600" y="378" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="800" letter-spacing="-1.5" text-anchor="middle">
